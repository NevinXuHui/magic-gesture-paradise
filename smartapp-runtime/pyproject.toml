[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smartapp-runtime"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
  "tomli>=2.0.1,<3; python_version < '3.11'",
]

[project.scripts]
smartapp-runtime = "smartapp_runtime.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
