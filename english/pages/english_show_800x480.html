  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #0b1020;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #stage {
    position: relative;
    width: 800px;
    height: 480px;
    overflow: hidden;
    /* 释义用中文：机器狗主控板只有 Droid Sans Fallback 覆盖 CJK，
       必须显式列出，否则回落到无中文字形的 DejaVu Sans 出豆腐块。 */
    font-family: "Baloo2", "PingFang SC", "Noto Sans CJK SC",
                 "Droid Sans Fallback", "WenQuanYi Micro Hei", sans-serif;
    background: linear-gradient(180deg,
      #9edcff 0%, #b7e6ff 34%, #dff3ff 62%, #fff7e0 100%);
    user-select: none;
    cursor: none;
  }

  /* ---------- 太阳 ---------- */
  #sun {
    position: absolute;
    top: 26px;
    left: 30px;
    width: 120px;
    height: 120px;
  }
  #sun .rays {
    position: absolute;
    inset: 0;
    will-change: transform;
    animation: sunSpin 40s linear infinite;
  }
  #sun .core {
    position: absolute;
    inset: 22px;
    border-radius: 50%;
    background: linear-gradient(180deg, #ffe86b, #ffc93d);
    box-shadow: inset 0 -6px 0 rgba(230, 150, 0, .25);
  }
  #sun .face { position: absolute; inset: 22px; }
  @keyframes sunSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ---------- 云朵 ---------- */
  .cloud {
    position: absolute;
    width: 130px;
    height: 46px;
    border-radius: 30px;
    background: #ffffff;
    opacity: .92;
    will-change: transform;
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: #ffffff;
    border-radius: 50%;
  }
  .cloud::before { width: 56px; height: 56px; left: 18px; top: -26px; }
  .cloud::after  { width: 40px; height: 40px; left: 62px; top: -18px; }
  #cloud1 { top: 54px;  animation: drift 70s linear -12s infinite; }
  #cloud2 { top: 118px; transform: scale(.7); animation: drift 95s linear -55s infinite; }
  #cloud3 { top: 22px;  transform: scale(.55); animation: drift 80s linear -30s infinite; }
  @keyframes drift {
    from { transform: translateX(-180px) scale(var(--s, 1)); }
    to   { transform: translateX(850px)  scale(var(--s, 1)); }
  }
  #cloud2 { --s: .7; }
  #cloud3 { --s: .55; }

  /* ---------- 彩虹（静态，只画一次） ---------- */
  #rainbow {
    position: absolute;
    right: -60px;
    bottom: 70px;
    width: 300px;
    height: 150px;
    overflow: hidden;
    opacity: .8;
  }
  #rainbow .arc {
    position: absolute;
    left: 0;
    top: 0;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    border: 14px solid transparent;
  }
  #rainbow .r1 { border-color: #ff9aa2; inset: 0; }
  #rainbow .r2 { border-color: #ffd93d; inset: 14px; }
  #rainbow .r3 { border-color: #8ce99a; inset: 28px; }
  #rainbow .r4 { border-color: #74c0fc; inset: 42px; }

  /* ---------- 草地 ---------- */
  #hills {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 800px;
    height: 120px;
  }

  /* ---------- 气球 ---------- */
  .balloon {
    position: absolute;
    width: 54px;
    height: 130px;
    will-change: transform;
    animation: floaty 4.6s ease-in-out infinite;
  }
  #balloonL { left: 34px;  bottom: 96px; animation-delay: -1.2s; }
  #balloonR { right: 40px; top: 40px; animation-delay: -3s; }
  @keyframes floaty {
    0%, 100% { transform: translateY(0)    rotate(-2deg); }
    50%      { transform: translateY(-12px) rotate(2deg); }
  }

  /* ---------- 顶部标题牌 ---------- */
  #banner {
    position: absolute;
    top: 18px;
    left: 50%;
    margin-left: -120px;
    width: 240px;
    height: 52px;
    border-radius: 26px;
    background: #ffffff;
    box-shadow: 0 4px 0 rgba(120, 90, 40, .18);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    will-change: transform;
    animation: bannerSway 5s ease-in-out infinite;
  }
  #banner .txt {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ff6b9d, #ff9f43, #4ea8ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  @keyframes bannerSway {
    0%, 100% { transform: rotate(-1.4deg); }
    50%      { transform: rotate(1.4deg); }
  }

  /* ---------- 单词区 ---------- */
  #wordArea {
    position: absolute;
    /* 3.5 寸屏认读性优先：留白压到最小，宽度全让给字母 */
    left: 14px;
    right: 14px;
    top: 96px;
    height: 250px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .line {
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .tile {
    position: relative;
    border-radius: 26%;
    background: linear-gradient(180deg, var(--hi), var(--bg));
    box-shadow: 0 6px 0 var(--lo), inset 0 2px 0 rgba(255, 255, 255, .55);
    display: flex;
    align-items: center;
    justify-content: center;
    transform: rotate(var(--rot));
    /* 入场：底部浮起 + 轻过冲。之前 scale(0)→1.18 的爆弹跳在 30fps 下
       每帧位移太大显得跳变；小幅缓动曲线才有"丝滑"感。 */
    animation: pop .65s cubic-bezier(.22, 1, .36, 1) var(--d) both;
  }
  .tile.out {
    animation: popOut .26s cubic-bezier(.4, 0, 1, 1) var(--d) both;
  }
  .tile .face {
    color: var(--ink);
    font-weight: 800;
    line-height: 1;
    text-shadow: 0 3px 0 rgba(0, 0, 0, .13);
    will-change: transform;
    animation: bob 2.8s ease-in-out var(--bd) infinite;
  }
  @keyframes pop {
    0%   { transform: translateY(30px) scale(.55) rotate(var(--rot)); opacity: 0; }
    45%  { opacity: 1; }
    62%  { transform: translateY(-7px) scale(1.06) rotate(var(--rot)); }
    100% { transform: translateY(0)    scale(1)    rotate(var(--rot)); opacity: 1; }
  }
  @keyframes popOut {
    0%   { transform: translateY(0)     scale(1)  rotate(var(--rot)); opacity: 1; }
    100% { transform: translateY(-14px) scale(.7) rotate(var(--rot)); opacity: 0; }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0)    scaleX(var(--sx, 1)); }
    50%      { transform: translateY(-7px) scaleX(var(--sx, 1)); }
  }

  /* ---------- 释义胶囊 ---------- */
  #meaning {
    position: absolute;
    left: 50%;
    top: 356px;
    transform: translateX(-50%) scale(0);
    min-width: 180px;
    max-width: 540px;
    padding: 10px 34px;
    border-radius: 34px;
    background: #ffffff;
    border: 4px solid #ffd6e5;
    box-shadow: 0 5px 0 rgba(190, 120, 150, .2);
    font-size: 40px;
    font-weight: 800;
    color: #7c5cad;
    text-align: center;
    white-space: nowrap;
    opacity: 0;
  }
  #meaning.in {
    animation: meaningPop .5s cubic-bezier(.25, 1.6, .45, 1) var(--d) both;
  }
  @keyframes meaningPop {
    0%   { transform: translateX(-50%) translateY(18px) scale(.8); opacity: 0; }
    60%  { transform: translateX(-50%) translateY(-4px) scale(1.03); opacity: 1; }
    100% { transform: translateX(-50%) translateY(0)    scale(1);    opacity: 1; }
  }

  /* ---------- 星星礼花 ---------- */
  .spark {
    position: absolute;
    width: 30px;
    height: 30px;
    pointer-events: none;
    animation: spark .9s ease-out both;
  }
  @keyframes spark {
    0%   { transform: scale(0)   rotate(0deg);   opacity: 0; }
    25%  { transform: scale(1.1) rotate(60deg);  opacity: 1; }

    width: 100%;
    height: 100%;

</style>

    ["#2ec4b6", "#72dcd2", "#1f9a8f", "#ffffff"]
  ];

  var DEMO_WORDS = [
    { word: "Apple",     meaning: "苹果" },
    { word: "Dog",       meaning: "小狗" },
    { word: "Sun",       meaning: "太阳" },
    { word: "Banana",    meaning: "香蕉" },
    { word: "Cat",       meaning: "小猫" },
    { word: "Rainbow",   meaning: "彩虹" },
    { word: "Elephant",  meaning: "大象" },
    { word: "Ice Cream", meaning: "冰淇淋" },
    { word: "Butterfly", meaning: "蝴蝶" },
    { word: "Star",      meaning: "星星" }
  ];

  var POP_STAGGER = 70;    /* 每个字母入场间隔 ms */
  var POP_DURATION = 650;
  /* 首块动画前留一帧余量：新块 DOM 刚建好当帧就起步的话，
     首帧光栅化会撞上动画开头，30fps 下能看出卡一下。 */
  var POP_BASE_DELAY = 80;
  var OUT_STAGGER = 30;
  var OUT_DURATION = 260;
  var MAX_SPARKS = 10;

  var wordArea = document.getElementById("wordArea");
  var meaningEl = document.getElementById("meaning");
  var stage = document.getElementById("stage");

  var generation = 0;
  var autoplayTimer = null;
  var showDelayTimer = null;
  var demoIndex = 0;
  var paletteOffset = 0;
  var pendingTimers = [];

  function later(fn, ms) {
    pendingTimers.push(setTimeout(fn, ms));
  }
  function clearPending() {
    while (pendingTimers.length) clearTimeout(pendingTimers.pop());
  }
  function clearShowDelay() {
    if (showDelayTimer) {
      clearTimeout(showDelayTimer);
      showDelayTimer = null;
    }
  }

  /* 把单词按空格拆行；单个词永远排一排 —— 拆两排试过，单词被腰斩
     认读性太差。长单词改走"窄块大字"：块宽按字数挤，高度和字号
     尽量吃满，见 buildTiles。 */
  function splitLines(word) {
    var parts = word.trim().split(/\s+/).filter(Boolean);
    if (parts.length <= 1) return parts.map(function (p) { return p.split(""); });
    /* 两个以上词：整体能放一行(含空隙)就一行，否则每词一行 */
    var total = parts.join("").length + parts.length - 1;
    if (total <= 9) return [word.trim().replace(/\s+/g, " ").split("")];
    return parts.map(function (p) { return p.split(""); });
  }

  /* 长单词把字距也收紧，省下的宽度全让给字母 */
  function rowGap(n) {
    return n >= 10 ? 5 : n >= 8 ? 8 : 10;
  }

  function tileSize(lines) {
    var usable = 772;
    var size = 140;
    lines.forEach(function (letters) {
      var n = letters.length;
      var gap = lines.length === 1 ? rowGap(n) : 10;
      var fit = Math.floor((usable - (n - 1) * gap) / n);
      if (fit < size) size = fit;
    });
    if (lines.length > 1 && size > 102) size = 102;
    if (size < 30) size = 30;
    return size;
  }

  /* 宽字母(m/w/M/W)在窄块里放不下时按实测宽度横向压缩。压缩比走
     --sx 进 bob 动画的 transform，直接写 style.transform 会被动画盖掉。 */
  var measureCtx = document.createElement("canvas").getContext("2d");
  function faceScale(ch, font, avail) {
    measureCtx.font = "800 " + font + "px Baloo2, 'PingFang SC', sans-serif";
    var w = measureCtx.measureText(ch).width;
    return w > avail ? Math.max(0.6, avail / w) : 1;
  }

  function buildTiles(lines, size) {
    wordArea.innerHTML = "";
    var index = 0;
    var single = lines.length === 1;
    /* 单排：块高尽量吃满(上限132px)，字号跟高度走 —— 字数多时块变窄
       但字不明显变小。多排(长短语)维持旧比例，防纵向溢出单词区。 */
    var tileH = single
      ? Math.max(Math.round(size * 1.14), Math.min(132, Math.round(size * 2.05)))
      : Math.round(size * 1.14);
    var font = single ? Math.round(tileH * 0.72) : Math.round(size * 0.76);
    paletteOffset = (paletteOffset + 3) % PALETTE.length;
    lines.forEach(function (letters) {
      var row = document.createElement("div");
      row.className = "line";
      if (single) row.style.gap = rowGap(letters.length) + "px";
      letters.forEach(function (ch) {
        if (ch === " ") {
          var gapEl = document.createElement("div");
          gapEl.style.width = Math.round(size * 0.4) + "px";
          row.appendChild(gapEl);
          index++;
          return;
        }
        var color = PALETTE[(index + paletteOffset) % PALETTE.length];
        var tile = document.createElement("div");
        tile.className = "tile";
        tile.style.width = size + "px";
        tile.style.height = tileH + "px";
        tile.style.setProperty("--bg", color[0]);
        tile.style.setProperty("--hi", color[1]);
        tile.style.setProperty("--lo", color[2]);
        tile.style.setProperty("--ink", color[3]);
        tile.style.setProperty("--rot", (((index * 7) % 11) - 5) + "deg");
        tile.style.setProperty("--d", (POP_BASE_DELAY + index * POP_STAGGER) + "ms");
        var face = document.createElement("span");
        face.className = "face";
        face.textContent = ch;
        face.style.fontSize = font + "px";
        var sx = faceScale(ch, font, size * 0.92);
        if (sx < 1) face.style.setProperty("--sx", sx.toFixed(3));
        face.style.setProperty("--bd", (-(index * 0.22)) + "s");
        tile.appendChild(face);
        row.appendChild(tile);
        index++;
      });
      wordArea.appendChild(row);
    });
    return index; /* 字母总数（含空格计数，用于节奏） */
  }

  function showMeaning(text, delayMs) {
    meaningEl.classList.remove("in");
    meaningEl.style.opacity = "0";
    if (!text) { meaningEl.textContent = ""; return; }
    meaningEl.textContent = text;
    meaningEl.style.setProperty("--d", delayMs + "ms");
    /* 重新触发动画 */
    void meaningEl.offsetWidth;
    meaningEl.classList.add("in");
  }

  function burstSparks(count) {
    var rect = wordArea.getBoundingClientRect();
    var stageRect = stage.getBoundingClientRect();
    for (var i = 0; i < Math.min(count, MAX_SPARKS); i++) {
      var s = document.createElement("div");
      s.className = "spark";
      var x = rect.left - stageRect.left + Math.random() * rect.width;
      var y = rect.top - stageRect.top + 20 + Math.random() * (rect.height - 40);
      s.style.left = Math.round(x) + "px";
      s.style.top = Math.round(y) + "px";
      s.style.animationDelay = Math.round(Math.random() * 350) + "ms";
      s.innerHTML =
        '<svg viewBox="0 0 30 30"><path d="M15 1 L18.5 11 L29 11.3 ' +
        'L20.7 17.8 L23.7 28 L15 21.9 L6.3 28 L9.3 17.8 L1 11.3 L11.5 11 Z" ' +
        'fill="' + (Math.random() < 0.5 ? "#ffd93d" : "#ff8fab") + '"/></svg>';
      s.addEventListener("animationend", function () {
        if (this.parentNode) this.parentNode.removeChild(this);
      });
      stage.appendChild(s);
    }
  }

  function renderWord(word, meaning) {
    var gen = ++generation;
    clearPending();

    var oldTiles = wordArea.querySelectorAll(".tile");
    var outDelay = 0;
    if (oldTiles.length) {
      for (var i = 0; i < oldTiles.length; i++) {
        var t = oldTiles[oldTiles.length - 1 - i];
        t.style.setProperty("--d", (i * OUT_STAGGER) + "ms");
        t.classList.add("out");
      }
      outDelay = oldTiles.length * OUT_STAGGER + OUT_DURATION;
      meaningEl.classList.remove("in");
      meaningEl.style.opacity = "0";
    }

    later(function () {
      if (gen !== generation) return;
      if (!word) { wordArea.innerHTML = ""; showMeaning("", 0); return; }
      var lines = splitLines(word);
      var size = tileSize(lines);
      var count = buildTiles(lines, size);
      var doneAt = POP_BASE_DELAY + count * POP_STAGGER + POP_DURATION;
      showMeaning(meaning, doneAt - 150);
      later(function () {
        if (gen !== generation) return;
        /* TTS 跟读：main.js 捕获这行 console 输出转发给板上 TTS 辅助
           进程。定在最后一个字母落定的时刻念，中途被切走的词不念。 */
        console.log("[english-tts] " + word);
        burstSparks(6 + Math.floor(Math.random() * 4));
      }, doneAt + 80);
    }, outDelay);
  }

  function stopAutoplay() {
    if (autoplayTimer) {
      clearInterval(autoplayTimer);
      autoplayTimer = null;
    }
  }

  function startAutoplay(intervalMs) {
    stopAutoplay();
    var cycle = intervalMs || 6000;
    var step = function () {
      var item = DEMO_WORDS[demoIndex % DEMO_WORDS.length];
      demoIndex++;
      renderWord(item.word, item.meaning);
    };
    step();
    autoplayTimer = setInterval(step, cycle);
  }

  /* ---------- 对外接口：平台/主进程调用 ---------- */
  window.englishShow = {
    /**
     * payload 是平台 body.data 的完整 JSON 字符串。
     * 数据只在页面这一层解析；上游 Python/Electron 不拆、不重组业务字段。
     */
    show: function (payload) {
      stopAutoplay();
      // 新 payload 到达时取消上一条尚未触发的延迟显示，避免旧单词晚到后覆盖新单词。
      clearShowDelay();

      if (typeof payload !== "string") {
        console.error("[english-show] payload must be a JSON string");
        return;
      }

      var data;
      try {
        data = JSON.parse(payload);
      } catch (error) {
        console.error("[english-show] invalid payload JSON: " + error.message);
        return;
      }

      if (!data || typeof data !== "object" || Array.isArray(data)) {
        console.error("[english-show] payload JSON must be an object");
        return;
      }

      var word = String(data.word || "");
      var meaning = String(data.meaning || "");

      // delay 单位为秒。缺省、非数字或负数都按 0 秒处理。
      var delaySeconds = Number(data.delay);
      if (!Number.isFinite(delaySeconds) || delaySeconds < 0) delaySeconds = 0;
      var delayMs = Math.round(delaySeconds * 1000);

      var showWord = function () {
        showDelayTimer = null;
        renderWord(word, meaning);
      };

      if (delayMs > 0) {
        showDelayTimer = setTimeout(showWord, delayMs);
      } else {
        showWord();
      }
    },
    setAutoplay: function (on, intervalMs) {
      if (on) {
        clearShowDelay();
        startAutoplay(intervalMs);
      } else {
        stopAutoplay();
      }
    },
    clear: function () {
      stopAutoplay();
      clearShowDelay();
      renderWord("", "");
    },
    /** 空闲挂起：屏幕已还给表情时，把整个舞台摘出渲染树。
        软件渲染下光是云飘/太阳转的持续合成就要吃掉大半个核，
        display:none 之后 Blink 没有任何可合成的层，占用真正归零。 */
    setIdle: function (on) {
      if (on) {
        stopAutoplay();
        clearShowDelay();
        clearPending();
        wordArea.innerHTML = "";
        meaningEl.classList.remove("in");
        meaningEl.style.opacity = "0";
      }
      stage.style.display = on ? "none" : "";
      document.body.style.background = on ? "#000" : "";
    }
  };

  // SmartApp Runtime delivers runtime_init/cloud_data through the renderer bridge.
  window.cloudShow = window.englishShow;
  if (window.smartApp && typeof window.smartApp.onMessage === "function") {
    window.smartApp.onMessage(function (message) {
      if (!message || typeof message !== "object") return;
      if (message.event === "runtime_init") {
        window.cloudShow.setAutoplay(false);
        window.cloudShow.clear();
      } else if (message.event === "cloud_data") {
        window.cloudShow.show(JSON.stringify(message.data || {}));
      } else if (message.event === "renderer_stop") {
        window.cloudShow.setIdle(true);
      }
    });
  }

  /* rAF 帧率采样，供主进程读取 window.__showFps 做性能统计 */
  (function fpsMeter() {
    var frames = 0;
    var mark = 0;
    window.__showFps = 0;
    function tick(now) {
      frames++;
      if (!mark) mark = now;
      else if (now - mark >= 1000) {
        window.__showFps = Math.round(frames * 1000 / (now - mark) * 10) / 10;
        frames = 0;
        mark = now;
      }
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();

  /* URL 参数：?word=Apple&meaning=苹果&demo=0&cycle=6000 */
  var params = new URLSearchParams(window.location.search);
  var startWord = params.get("word");
  var demoOff = params.get("demo") === "0";
  var cycleMs = parseInt(params.get("cycle") || "6000", 10);

  window.addEventListener("load", function () {
    if (startWord) {
      renderWord(startWord, params.get("meaning") || "");
    } else if (!demoOff) {
      later(function () { startAutoplay(cycleMs); }, 400);
    }
    console.log("ENGLISH_SHOW_READY");
  });
})();
</script>
</body>
</html>
